# ICOCARD multi-domain
# HTML/API must not be cached (Cloudflare / browser). Hashed /assets/ may be cached.
# SPA HTML is proxied to Node so Open Graph tags are injected by path (crawlers skip JS).

# Shared: proxy SPA HTML with OG injection
# (inlined in each server block below)

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name icocard.net www.icocard.net _;
    root /var/www/icocard/frontend/dist;
    index index.html;
    client_max_body_size 10m;

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }
    location /og/ {
        add_header Cache-Control "public, max-age=3600" always;
        proxy_pass http://127.0.0.1:3001/og/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header CDN-Cache-Control "no-store" always;
        proxy_pass http://127.0.0.1:3001/api/public/spa;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header CDN-Cache-Control "no-store" always;
        try_files $uri $uri/ @spa_html;
    }
    location @spa_html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header CDN-Cache-Control "no-store" always;
        rewrite ^ /api/public/spa break;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
        add_header CDN-Cache-Control "no-store" always;
        proxy_hide_header Cache-Control;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /v2/webhooks/ {
        add_header Cache-Control "no-store" always;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /health {
        add_header Cache-Control "no-store" always;
        proxy_pass http://127.0.0.1:3001;
    }
}

